[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autokernel-pbt"
version = "0.1.0"
description = "Property-based testing for automated kernel development and translation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  # Upper bound is load-bearing, not caution. Lambda Stack's torch is built against
  # numpy 1.x; installing 2.x over it destroys torch's numpy interop silently --
  # `Failed to initialize NumPy: _ARRAY_API not found` -- and the Triton backend calls
  # torch.as_tensor(ndarray) on every launch. Measured on the first hardware run.
  "numpy>=1.24,<2",
  "pyyaml>=6.0",
  "jsonschema>=4.20",
  "safetensors>=0.4",
  # Bounded by the numpy pin above: pyarrow 26 requires NumPy >= 2 and fails at import
  # under 1.x ("pyarrow requires NumPy 2.0 or newer"); CI went red on it in October 2026.
  "pyarrow>=15.0,<26",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=4.1",
  "ruff>=0.16",
]
gpu = [
  "torch>=2.2",
  "triton>=3.0",
  # NVRTC and the driver API, for the CUDA backend (feature 0012). Its major must match the
  # CUDA major torch was built for: 13.x needs a CUDA 13 driver and drops `cuda.cuda`.
  # Bounded to the 12.x stack this project records on; scripts/gpu_bootstrap.sh installs
  # the major matching torch, which is what a CUDA 13 instance needs. 12.9 is the floor
  # because earlier 12.x bindings do not find a pip-installed NVRTC.
  "cuda-python>=12.9,<13",
]

[project.scripts]
akpbt = "autokernel_pbt.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/autokernel_pbt"]

# specs/schemas/ is the single source of truth for the JSON schemas, and it sits
# outside the package, so a wheel would ship without it and every `validate` in an
# installed copy would fail. Copied in at build time only; `autokernel_pbt.schema`
# reads this copy when present and falls back to the repo for editable installs.
[tool.hatch.build.targets.wheel.force-include]
"specs/schemas" = "autokernel_pbt/schemas"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra --strict-markers"
# Warnings are a fail-loud channel, not advisory noise: without this, sediment
# accumulates in the summary until a genuinely new warning becomes invisible.
# Tests that legitimately provoke a warning opt out with @pytest.mark.filterwarnings.
filterwarnings = ["error"]
markers = [
  "gpu: requires CUDA GPU",
  "integration: cross-component tests",
  "spec: derived from specs/features acceptance criteria",
  "formal: requires a formal toolchain (skipped when it is absent)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
# Mutant bodies are recorded VERBATIM as returned by a blinded authoring agent, and
# one of them contains a dead assignment. Deleting it would edit the mutant; a noqa
# comment would touch the line. Neither is acceptable -- a mutant tidied by someone
# who has seen the property set is no longer a blinded mutant, and the gate, not the
# editor, is where unusable candidates are removed. Ignored per-file so the bodies
# stay byte-identical to what the agent produced.
"kernels/mutants/grown_mutants.py" = ["F841"]
# TRY004 wants TypeError when a malformed value is the wrong *type*. The contract
# loader deliberately raises ValueError for every defect in an acceptance.yaml —
# blank ids, missing keys, unknown check types, non-mappings alike — because from a
# caller's view they are one concept: "this contract file is not usable". Splitting
# the type-shaped subset out would make every caller catch two exceptions for it.
"src/autokernel_pbt/props/contract.py" = ["TRY004"]
